name: Build and publish dcrd image

# Builds the multi-arch (amd64 + arm64) dcrd image and publishes it to the
# GitHub Container Registry (ghcr.io).
#
# Triggers:
#   * Push to master                -> publishes :latest (+ the default version)
#   * Push of a git tag like v2.1.5 -> publishes :v2.1.5, :2.1.5, :latest
#   * Pull request to master        -> builds (amd64 only) to validate, no push
#   * Manual run (workflow_dispatch)-> build any dcrd version on demand
on:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      dcrd_version:
        description: 'dcrd version to build (e.g. 2.1.5 -> builds git tag release-v2.1.5)'
        required: true
        default: '2.1.5'
      mark_latest:
        description: 'Also move the :latest tag to this build'
        type: boolean
        default: false

# Only one build per ref at a time; a newer push supersedes an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dcrd-mainnet
  # Version built for pushes to the master branch (where no version tag exists).
  DEFAULT_DCRD_VERSION: '2.1.5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine build parameters
        id: params
        run: |
          EVENT="${{ github.event_name }}"

          # Resolve which dcrd version to build.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.dcrd_version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${DEFAULT_DCRD_VERSION}"
          fi
          VERSION="${VERSION#v}"   # tolerate a leading "v"

          # Pull requests only validate the build; everything else publishes.
          if [ "$EVENT" = "pull_request" ]; then
            PUSH=false
            PLATFORMS="linux/amd64"
          else
            PUSH=true
            PLATFORMS="linux/amd64,linux/arm64"
          fi

          # Move :latest only for branch/tag pushes (always the newest), or for
          # a manual run that explicitly opts in. This prevents a manual build
          # of an older version from clobbering :latest.
          LATEST=false
          if [ "$EVENT" = "push" ]; then
            LATEST=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mark_latest }}" = "true" ]; then
            LATEST=true
          fi

          {
            echo "version=${VERSION}"
            echo "build_tag=release-v${VERSION}"
            echo "push=${PUSH}"
            echo "platforms=${PLATFORMS}"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "dcrd release-v${VERSION} | push=${PUSH} | platforms=${PLATFORMS} | latest=${LATEST}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: steps.params.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.params.outputs.version }}
            type=raw,value=v${{ steps.params.outputs.version }}
            type=raw,value=latest,enable=${{ steps.params.outputs.latest }}
          labels: |
            org.opencontainers.image.title=dcrd-mainnet
            org.opencontainers.image.description=Decred full node (dcrd) v${{ steps.params.outputs.version }} for mainnet, built from source on a scratch base.
            org.opencontainers.image.vendor=Decred
            org.opencontainers.image.licenses=ISC

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: ${{ steps.params.outputs.push }}
          provenance: false
          build-args: |
            DCRD_BUILD_TAG=${{ steps.params.outputs.build_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
